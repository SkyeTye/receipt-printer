<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Receipt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root {
      --bg:#f0f0f3; --text:#3a3a4a; --text-2:#7a7a8a; --text-3:#b8b8c8;
      --accent:#6366f1; --accent-bg:rgba(99,102,241,.1);
      --sh-l:#ffffff; --sh-d:#d1d1d9;
    }
    *{box-sizing:border-box;}
    body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
    h2{font-size:15px;font-weight:600;color:var(--text);}

    /* Cards */
    .nm-card{background:var(--bg);border-radius:22px;padding:22px;box-shadow:-8px -8px 16px var(--sh-l),8px 8px 16px var(--sh-d);}

    /* Buttons */
    .nm-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--bg);border:none;border-radius:12px;box-shadow:-4px -4px 10px var(--sh-l),4px 4px 10px var(--sh-d);color:var(--text);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;padding:10px 18px;transition:box-shadow .15s,transform .1s;text-decoration:none;white-space:nowrap;}
    .nm-btn:hover{box-shadow:-5px -5px 12px var(--sh-l),5px 5px 12px var(--sh-d);}
    .nm-btn:active{box-shadow:inset -3px -3px 6px var(--sh-l),inset 3px 3px 6px var(--sh-d);transform:scale(.98);}
    .nm-btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}
    .nm-btn-primary{background:var(--accent);color:#fff;box-shadow:-3px -3px 8px rgba(255,255,255,.5),4px 4px 10px rgba(80,80,200,.45);}
    .nm-btn-primary:hover{background:#5254d4;box-shadow:-3px -3px 8px rgba(255,255,255,.5),4px 4px 12px rgba(80,80,200,.5);}
    .nm-btn-primary:active{background:#4b4cbf;box-shadow:inset -2px -2px 5px rgba(255,255,255,.25),inset 2px 2px 5px rgba(40,40,130,.4);}
    .nm-btn-soft{color:var(--text-2);box-shadow:-3px -3px 8px var(--sh-l),3px 3px 8px var(--sh-d);}
    .nm-btn-soft:hover{color:var(--text);}
    .nm-btn-ghost{background:transparent;box-shadow:none;color:var(--text-3);padding:4px 8px;}
    .nm-btn-ghost:hover{color:var(--text-2);box-shadow:none;}
    .nm-btn-ghost:active{box-shadow:none;transform:none;}

    /* Inputs */
    .nm-input{background:var(--bg);border:none;border-radius:12px;box-shadow:inset -4px -4px 8px var(--sh-l),inset 4px 4px 8px var(--sh-d);color:var(--text);font-family:inherit;font-size:13px;outline:none;padding:11px 14px;width:100%;transition:box-shadow .15s;}
    .nm-input:focus{box-shadow:inset -3px -3px 6px var(--sh-l),inset 3px 3px 6px #c5c5d0,0 0 0 2px var(--accent-bg);}
    .nm-input::placeholder{color:var(--text-3);}

    /* Nav */
    .nm-nav-wrap{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 16px 12px;}
    .nm-nav-inner{max-width:672px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .nm-brand{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);text-decoration:none;opacity:.65;white-space:nowrap;flex-shrink:0;}
    .nm-nav{display:flex;align-items:center;background:var(--bg);border-radius:100px;box-shadow:-5px -5px 10px var(--sh-l),5px 5px 10px var(--sh-d);padding:4px;gap:2px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
    .nm-nav::-webkit-scrollbar{display:none;}
    .nm-nav a{border-radius:100px;padding:6px 13px;font-size:12px;font-weight:500;text-decoration:none;color:var(--text-2);white-space:nowrap;flex-shrink:0;transition:color .2s,box-shadow .2s;}
    .nm-nav a:hover{color:var(--text);}
    .nm-nav a.active{box-shadow:inset -2px -2px 5px var(--sh-l),inset 2px 2px 5px var(--sh-d);color:var(--accent);font-weight:600;}

    /* Todo rows */
    .todo-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.04);}
    .todo-row:last-child{border-bottom:none;}
    .todo-text{flex:1;font-size:13px;color:var(--text);}
    .done-text{color:var(--text-3);text-decoration:line-through;}
    .drag-handle{color:var(--text-3);font-size:14px;cursor:grab;user-select:none;flex-shrink:0;transition:color .15s;line-height:1;}
    .drag-handle:hover{color:var(--text-2);}
    .drag-handle:active{cursor:grabbing;}
    .del-btn{opacity:0;transition:opacity .2s;font-size:17px;color:var(--text-3);padding:3px 6px;background:transparent;border:none;cursor:pointer;flex-shrink:0;line-height:1;}
    .del-btn:hover{color:#e05353;opacity:1!important;}
    .todo-row:hover .del-btn{opacity:1;}

    /* Checkboxes */
    .nm-check{width:22px;height:22px;border-radius:7px;border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:box-shadow .15s;}
    .nm-check-off{background:var(--bg);box-shadow:-3px -3px 6px var(--sh-l),3px 3px 6px var(--sh-d);}
    .nm-check-off:hover{box-shadow:-4px -4px 8px var(--sh-l),4px 4px 8px var(--sh-d);}
    .nm-check-on{background:var(--accent-bg);box-shadow:inset -2px -2px 5px var(--sh-l),inset 2px 2px 5px var(--sh-d);color:var(--accent);}

    /* Banners */
    .nm-banner{border-radius:12px;box-shadow:inset -3px -3px 6px var(--sh-l),inset 3px 3px 6px var(--sh-d);padding:10px 14px;font-size:13px;text-align:center;font-weight:500;}
    .nm-banner-success{color:#3da870;}
    .nm-banner-error{color:#e05353;}

    /* Pinned todos */
    .todo-row.pinned{border-left:2.5px solid var(--accent);padding-left:10px;margin-left:-12px;}
    .todo-row.pinned .drag-handle{color:var(--accent);opacity:.55;}
    .todo-row.pinned .todo-text{font-weight:600;}
    .priority-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);opacity:.7;margin-bottom:6px;display:block;}

    /* Long-press feedback */
    .nm-check.pressing{box-shadow:inset -2px -2px 5px var(--sh-l),inset 2px 2px 5px var(--sh-d);transform:scale(.88);background:var(--accent-bg);}

    /* Misc */
    .nm-divider{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--sh-d) 20%,var(--sh-d) 80%,transparent);opacity:.45;margin:2px 0;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--sh-d);border-radius:4px;}
  </style>
  <script>
    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function copyShareLink() {
      const res = await fetch('/api/share-token');
      const { token } = await res.json();
      await navigator.clipboard.writeText(`${window.location.origin}/share/${token}`);
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Share link'; }, 2000);
    }

    async function loadTodos() {
      const res   = await fetch('/api/todos');
      const todos = await res.json();
      renderDo(todos.filter(t => !t.completed));
      renderDone(todos.filter(t => t.completed));
    }

    // ── Long-press to pin ──────────────────────────────────
    let _pressTimer = null;

    function startPress(id, el) {
      el.classList.add('pressing');
      _pressTimer = setTimeout(() => {
        _pressTimer = null;
        el.classList.remove('pressing');
        togglePin(id);
      }, 600);
    }

    function endPress(id, el, doComplete) {
      if (_pressTimer) {
        clearTimeout(_pressTimer);
        _pressTimer = null;
        el.classList.remove('pressing');
        if (doComplete) toggleTodo(id);
      } else {
        el.classList.remove('pressing');
      }
    }

    async function togglePin(id) {
      await fetch(`/api/todos/${id}/pin`, { method: 'POST' });
      loadTodos();
    }

    function todoRowHtml(todo) {
      const pinned = todo.pinned ? 'pinned' : '';
      return `
        <div data-id="${todo.id}" class="todo-row ${pinned}">
          <span class="drag-handle" title="Drag to reorder">⠿</span>
          <button
            class="nm-check nm-check-off"
            title="Tap to complete · Hold to pin"
            onpointerdown="startPress(${todo.id}, this)"
            onpointerup="endPress(${todo.id}, this, true)"
            onpointerleave="endPress(${todo.id}, this, false)"
            oncontextmenu="return false"
          ></button>
          <span class="todo-text">${escHtml(todo.text)}</span>
          <button onclick="deleteTodo(${todo.id})" class="del-btn">&times;</button>
        </div>
      `;
    }

    function makeSortable(listEl) {
      Sortable.create(listEl, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'opacity-40',
        onEnd: () => {
          const ids = [...listEl.querySelectorAll('[data-id]')].map(el => parseInt(el.dataset.id));
          fetch('/api/todos/reorder', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids }),
          });
        },
      });
    }

    function renderDo(todos) {
      const pinnedSection = document.getElementById('pinned-section');
      const pinnedList    = document.getElementById('pinned-list');
      const unpinnedList  = document.getElementById('unpinned-list');
      const emptyState    = document.getElementById('do-empty');

      const pinned   = todos.filter(t => t.pinned);
      const unpinned = todos.filter(t => !t.pinned);

      if (todos.length === 0) {
        pinnedSection.classList.add('hidden');
        pinnedList.innerHTML = '';
        unpinnedList.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      if (pinned.length > 0) {
        pinnedSection.classList.remove('hidden');
        pinnedList.innerHTML = pinned.map(todoRowHtml).join('');
        makeSortable(pinnedList);
      } else {
        pinnedSection.classList.add('hidden');
        pinnedList.innerHTML = '';
      }

      unpinnedList.innerHTML = unpinned.map(todoRowHtml).join('');
      if (unpinned.length > 0) makeSortable(unpinnedList);
    }

    function renderDone(todos) {
      const list   = document.getElementById('done-list');
      const cutoff = Date.now() - 48 * 60 * 60 * 1000;
      const recent = todos.filter(t => t.completed_at && new Date(t.completed_at).getTime() > cutoff);
      if (recent.length === 0) {
        list.innerHTML = '<p style="color:var(--text-3);font-size:13px;text-align:center;padding:20px 0;">Nothing in the last 48 hours.</p>';
        return;
      }
      list.innerHTML = recent.map(todo => `
        <div class="todo-row">
          <button onclick="toggleTodo(${todo.id})" class="nm-check nm-check-on" title="Mark undone">
            <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 3.5L3.5 6L9 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="todo-text done-text">${escHtml(todo.text)}</span>
          <button onclick="deleteTodo(${todo.id})" class="del-btn">&times;</button>
        </div>
      `).join('');
    }

    async function addDone() {
      const input = document.getElementById('done-input');
      const text  = input.value.trim();
      if (!text) return;
      const res = await fetch('/api/todos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, completed: true }),
      });
      if (res.ok) { input.value = ''; loadTodos(); }
    }

    async function addTodo() {
      const input = document.getElementById('todo-input');
      const text  = input.value.trim();
      if (!text) return;
      const res = await fetch('/api/todos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (res.ok) {
        input.value = ''; loadTodos();
        confetti({ particleCount: 40, spread: 50, origin: { y: 0.4 }, scalar: 0.7 });
      }
    }

    async function toggleTodo(id) {
      await fetch(`/api/todos/${id}/complete`, { method: 'POST' });
      loadTodos();
    }

    async function deleteTodo(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      loadTodos();
    }

    async function handlePrint(e) {
      e.preventDefault();
      const btn   = document.getElementById('print-btn');
      const input = document.getElementById('print-input');
      btn.disabled = true; btn.textContent = 'Sending…';
      document.getElementById('print-error').classList.add('hidden');
      try {
        const res = await fetch('/print', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: input.value }),
        });
        if (!res.ok) throw new Error();
        input.value = '';
        const s = document.getElementById('print-success');
        s.classList.remove('hidden');
        setTimeout(() => s.classList.add('hidden'), 3000);
      } catch {
        document.getElementById('print-error').classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'Send';
      }
    }

    window.onload = () => {
      document.querySelectorAll('.nm-nav a').forEach(a => { if (a.pathname === location.pathname) a.classList.add('active'); });
      loadTodos();
    };
  </script>
</head>
<body>
  <header class="nm-nav-wrap">
    <div class="nm-nav-inner">
      <a href="/" class="nm-brand">Life Receipt</a>
      <nav class="nm-nav">
        <a href="/">Home</a>
        <a href="/daily">Daily</a>
        <a href="/week-wrapped">Week Wrapped</a>
        <a href="/archive">Archive</a>
        <a href="/settings">Settings</a>
      </nav>
    </div>
  </header>

  <main style="max-width:672px;margin:0 auto;padding:8px 16px 48px;">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">

      <!-- DO -->
      <div class="nm-card flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2>Do</h2>
          <button id="copy-btn" onclick="copyShareLink()" class="nm-btn nm-btn-ghost" style="font-size:12px;">Share link</button>
        </div>
        <div class="flex-1" style="min-height:72px;">
          <div id="pinned-section" class="hidden">
            <span class="priority-label">Priority</span>
            <div id="pinned-list"></div>
            <hr class="nm-divider" style="margin:8px 0 10px;" />
          </div>
          <div id="unpinned-list"></div>
          <p id="do-empty" class="hidden" style="color:var(--text-3);font-size:13px;text-align:center;padding:20px 0;">Nothing here yet.</p>
        </div>
        <div style="margin:14px 0 16px;"><hr class="nm-divider" /></div>
        <input
          id="todo-input" class="nm-input" type="text"
          placeholder="Add a task…" maxlength="100"
          onkeypress="if(event.key==='Enter'){event.preventDefault();addTodo()}"
          style="margin-bottom:10px;"
        />
        <button onclick="addTodo()" class="nm-btn nm-btn-primary" style="width:100%;padding:11px;">+ Add to Do</button>
      </div>

      <!-- DONE -->
      <div class="nm-card flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2>Done</h2>
          <a href="/archive" class="nm-btn nm-btn-ghost" style="font-size:12px;">Archive →</a>
        </div>
        <div id="done-list" class="flex-1" style="min-height:72px;"></div>
        <div style="margin:14px 0 16px;"><hr class="nm-divider" /></div>
        <input
          id="done-input" class="nm-input" type="text"
          placeholder="Log something completed…"
          onkeypress="if(event.key==='Enter'){event.preventDefault();addDone()}"
          style="margin-bottom:10px;"
        />
        <button onclick="addDone()" class="nm-btn nm-btn-soft" style="width:100%;padding:11px;">✓ Mark as Done</button>
      </div>
    </div>

    <!-- Print -->
    <div class="nm-card">
      <h2 style="margin-bottom:14px;">Print a receipt</h2>
      <div class="flex gap-3">
        <input
          id="print-input" class="nm-input" type="text"
          maxlength="200" placeholder="Type anything to print…"
          onkeypress="if(event.key==='Enter') handlePrint(event)"
        />
        <button id="print-btn" onclick="handlePrint(event)" class="nm-btn nm-btn-primary" style="flex-shrink:0;padding:11px 20px;">Send</button>
      </div>
      <p id="print-success" class="hidden nm-banner nm-banner-success" style="margin-top:12px;">Queued — printing shortly.</p>
      <p id="print-error"   class="hidden nm-banner nm-banner-error"   style="margin-top:12px;">Something went wrong. Try again.</p>
    </div>

  </main>

  <footer style="text-align:center;padding:0 0 32px;font-size:12px;color:var(--text-3);">Made by Skye Gaertner</footer>
</body>
</html>
