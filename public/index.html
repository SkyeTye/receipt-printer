<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Receipt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    // ── Share link ──────────────────────────────────────────
    async function copyShareLink() {
      const res   = await fetch('/api/share-token');
      const { token } = await res.json();
      const url   = `${window.location.origin}/share/${token}`;
      await navigator.clipboard.writeText(url);

      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy share link'; }, 2000);
    }

    // ── Todos ───────────────────────────────────────────────
    async function loadTodos() {
      const res   = await fetch('/api/todos');
      const todos = await res.json();

      const incomplete = todos.filter(t => !t.completed);
      const complete   = todos.filter(t =>  t.completed);

      renderDo(incomplete);
      renderDone(complete);
    }

    function renderDo(todos) {
      const list = document.getElementById('do-list');
      if (todos.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Nothing here yet.</p>';
        return;
      }
      list.innerHTML = todos.map(todo => `
        <div class="flex items-center gap-3 py-2.5 border-b border-gray-100 last:border-0 group">
          <button
            onclick="toggleTodo(${todo.id})"
            class="w-5 h-5 rounded border-2 border-gray-300 hover:border-gray-500 flex-shrink-0 flex items-center justify-center transition-colors"
            title="Mark done"
          ></button>
          <span class="flex-1 text-gray-800 text-sm">${escHtml(todo.text)}</span>
          <button onclick="deleteTodo(${todo.id})" class="text-gray-200 hover:text-red-400 transition-colors opacity-0 group-hover:opacity-100 text-lg leading-none">&times;</button>
        </div>
      `).join('');
    }

    function renderDone(todos) {
      const list = document.getElementById('done-list');
      if (todos.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Nothing completed yet.</p>';
        return;
      }
      list.innerHTML = todos.map(todo => `
        <div class="flex items-center gap-3 py-2.5 border-b border-gray-100 last:border-0 group">
          <button
            onclick="toggleTodo(${todo.id})"
            class="w-5 h-5 rounded border-2 bg-gray-400 border-gray-400 flex-shrink-0 flex items-center justify-center transition-colors hover:bg-gray-300 hover:border-gray-300"
            title="Mark undone"
          >
            <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </button>
          <span class="flex-1 text-gray-400 text-sm line-through">${escHtml(todo.text)}</span>
          <button onclick="deleteTodo(${todo.id})" class="text-gray-200 hover:text-red-400 transition-colors opacity-0 group-hover:opacity-100 text-lg leading-none">&times;</button>
        </div>
      `).join('');
    }

    async function addTodo(completed = false) {
      const input = document.getElementById('todo-input');
      const text  = input.value.trim();
      if (!text) return;

      const res = await fetch('/api/todos', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ text, completed }),
      });

      if (res.ok) {
        input.value = '';
        loadTodos();
        if (!completed) {
          confetti({ particleCount: 40, spread: 50, origin: { y: 0.4 }, scalar: 0.7 });
        }
      }
    }

    async function toggleTodo(id) {
      await fetch(`/api/todos/${id}/complete`, { method: 'POST' });
      loadTodos();
    }

    async function deleteTodo(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      loadTodos();
    }

    // ── Instant Print ───────────────────────────────────────
    async function handlePrint(e) {
      e.preventDefault();
      const btn     = document.getElementById('print-btn');
      const input   = document.getElementById('print-input');
      const success = document.getElementById('print-success');
      const error   = document.getElementById('print-error');

      btn.disabled = true;
      error.classList.add('hidden');

      try {
        const res = await fetch('/print', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ message: input.value }),
        });
        if (!res.ok) throw new Error();
        input.value = '';
        success.classList.remove('hidden');
        setTimeout(() => success.classList.add('hidden'), 3000);
      } catch {
        error.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    window.onload = loadTodos;
  </script>
</head>
<body class="min-h-screen py-12 px-4 font-sans">

  <nav class="w-full max-w-2xl mx-auto flex justify-end mb-6 gap-4 text-sm text-gray-500">
    <a href="/daily"    class="hover:text-gray-800 transition-colors">Daily Planner</a>
    <a href="/settings" class="hover:text-gray-800 transition-colors">Settings</a>
  </nav>

  <main class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-semibold mb-8 text-gray-900 tracking-tight text-center">Life Receipt</h1>

    <!-- Two-box layout -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">

      <!-- DO -->
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 flex flex-col">
        <h2 class="text-lg font-semibold text-gray-900 mb-4 tracking-tight">Do</h2>

        <div id="do-list" class="flex-1 mb-4 min-h-[80px]"></div>

        <div class="pt-4 border-t border-gray-100 space-y-2">
          <input
            id="todo-input"
            type="text"
            placeholder="Add a task…"
            maxlength="100"
            onkeypress="if(event.key==='Enter'){event.preventDefault();addTodo(false)}"
            class="w-full p-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300"
          />
          <div class="grid grid-cols-2 gap-2">
            <button
              onclick="addTodo(false)"
              class="bg-gray-900 hover:bg-gray-700 text-white text-xs py-2 rounded-lg font-medium transition-all"
            >+ Add to Do</button>
            <button
              onclick="addTodo(true)"
              class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs py-2 rounded-lg font-medium transition-all"
            >✓ Already Done</button>
          </div>
          <button
            id="copy-btn"
            onclick="copyShareLink()"
            class="w-full text-xs text-gray-400 hover:text-gray-600 transition-colors py-1"
          >Copy share link</button>
        </div>
      </div>

      <!-- DONE -->
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 flex flex-col">
        <h2 class="text-lg font-semibold text-gray-900 mb-4 tracking-tight">Done</h2>
        <div id="done-list" class="flex-1 min-h-[80px]"></div>
      </div>

    </div>

    <!-- Instant Print (secondary) -->
    <div class="bg-white rounded-2xl shadow border border-gray-100 p-6">
      <h2 class="text-base font-semibold text-gray-800 mb-3">Print a receipt</h2>
      <div class="flex gap-2">
        <input
          id="print-input"
          type="text"
          maxlength="200"
          placeholder="Type anything to print…"
          onkeypress="if(event.key==='Enter') handlePrint(event)"
          class="flex-1 p-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300"
        />
        <button
          id="print-btn"
          onclick="handlePrint(event)"
          class="bg-gray-900 hover:bg-gray-700 disabled:opacity-50 text-white text-sm px-5 rounded-lg font-medium transition-all"
        >Send</button>
      </div>
      <p id="print-success" class="hidden mt-2 text-green-600 text-sm">Queued — printing shortly.</p>
      <p id="print-error"   class="hidden mt-2 text-red-500 text-sm">Something went wrong. Try again.</p>
    </div>
  </main>

  <footer class="text-sm text-gray-400 mt-16 text-center">
    Made by Skye Gaertner
  </footer>

</body>
</html>
