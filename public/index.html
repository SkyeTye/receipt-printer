<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Receipt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer>
    function handleInput(el) {
      const counter = document.getElementById('char-counter');
      const remaining = 200 - el.value.length;
      counter.textContent = `${remaining} characters left`;
      counter.classList.toggle('text-red-500', remaining <= 20);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('receipt-form');
      const btn = document.getElementById('submit-btn');
      const thankYou = document.getElementById('thank-you');
      const errorMsg = document.getElementById('error-msg');

      btn.disabled = true;
      btn.textContent = 'Sending…';
      errorMsg.classList.add('hidden');

      try {
        const res = await fetch('/print', {
          method: 'POST',
          body: new FormData(form),
        });
        if (!res.ok) throw new Error('Server error');

        form.classList.add('hidden');
        thankYou.classList.remove('hidden');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

        setTimeout(() => {
          form.classList.remove('hidden');
          thankYou.classList.add('hidden');
          document.querySelector('textarea').value = '';
          handleInput(document.querySelector('textarea'));
        }, 3000);
      } catch {
        errorMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send';
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('receipt-form').dispatchEvent(new Event('submit'));
      }
    }
  </script>
</head>
<body class="flex flex-col min-h-screen justify-between items-center py-12 px-4 font-sans">

  <nav class="w-full max-w-md flex justify-end mb-4 gap-4 text-sm text-gray-500">
    <a href="/settings" class="hover:text-gray-800 transition-colors">Settings</a>
  </nav>

  <main class="w-full max-w-md text-center">
    <h1 class="text-3xl font-semibold mb-10 text-gray-900 tracking-tight">Life Receipt</h1>

    <form id="receipt-form" onsubmit="handleSubmit(event)" class="bg-white shadow-2xl rounded-3xl p-8 space-y-6 border border-gray-100">
      <textarea
        name="message"
        maxlength="200"
        oninput="handleInput(this)"
        onkeypress="handleKeyPress(event)"
        placeholder="Type your receipt…"
        class="w-full p-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent resize-none text-gray-800 placeholder-gray-400"
        rows="4"
        required
        autofocus
      ></textarea>
      <div id="char-counter" class="text-sm text-gray-500 text-right">200 characters left</div>
      <button
        id="submit-btn"
        type="submit"
        class="w-full bg-gray-900 hover:bg-gray-800 disabled:opacity-50 text-white py-3 rounded-xl font-medium transition-all duration-200 hover:scale-[1.02] hover:shadow-lg"
      >
        Send
      </button>
    </form>

    <p id="error-msg" class="hidden mt-4 text-red-500 text-sm">Something went wrong. Please try again.</p>

    <div id="thank-you" class="hidden text-gray-700 font-semibold text-xl mt-8 animate-fade-in">
      Receipt submitted. On its way!
    </div>
  </main>

  <footer class="text-sm text-gray-400 mt-16">
    Designed with love by <a href="https://urbancircles.club" target="_blank" class="text-gray-500 hover:text-gray-700 underline underline-offset-2">Peter / Urban Circles</a>
  </footer>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
  </style>
</body>
</html>
