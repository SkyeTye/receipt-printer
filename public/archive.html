<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archive — Life Receipt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root {
      --bg:#f0f0f3; --text:#3a3a4a; --text-2:#7a7a8a; --text-3:#b8b8c8;
      --accent:#6366f1; --accent-bg:rgba(99,102,241,.1);
      --sh-l:#ffffff; --sh-d:#d1d1d9;
    }
    *{box-sizing:border-box;}
    body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
    h1{font-size:22px;font-weight:700;letter-spacing:-.3px;}
    p{font-size:13px;line-height:1.5;color:var(--text-2);}

    .nm-card{background:var(--bg);border-radius:22px;padding:22px;box-shadow:-8px -8px 16px var(--sh-l),8px 8px 16px var(--sh-d);}
    .nm-input{background:var(--bg);border:none;border-radius:12px;box-shadow:inset -4px -4px 8px var(--sh-l),inset 4px 4px 8px var(--sh-d);color:var(--text);font-family:inherit;font-size:13px;outline:none;padding:11px 14px;width:100%;transition:box-shadow .15s;}
    .nm-input:focus{box-shadow:inset -3px -3px 6px var(--sh-l),inset 3px 3px 6px #c5c5d0,0 0 0 2px var(--accent-bg);}
    .nm-input::placeholder{color:var(--text-3);}

    .nm-nav-wrap{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 16px 12px;}
    .nm-nav-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .nm-brand{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);text-decoration:none;opacity:.65;white-space:nowrap;flex-shrink:0;}
    .nm-nav{display:flex;align-items:center;background:var(--bg);border-radius:100px;box-shadow:-5px -5px 10px var(--sh-l),5px 5px 10px var(--sh-d);padding:4px;gap:2px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
    .nm-nav::-webkit-scrollbar{display:none;}
    .nm-nav a{border-radius:100px;padding:6px 13px;font-size:12px;font-weight:500;text-decoration:none;color:var(--text-2);white-space:nowrap;flex-shrink:0;transition:color .2s,box-shadow .2s;}
    .nm-nav a:hover{color:var(--text);}
    .nm-nav a.active{box-shadow:inset -2px -2px 5px var(--sh-l),inset 2px 2px 5px var(--sh-d);color:var(--accent);font-weight:600;}

    .archive-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.04);}
    .archive-row:last-child{border-bottom:none;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--sh-d);border-radius:4px;}
  </style>
  <script>
    let allItems = [];

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadArchive() {
      const res   = await fetch('/api/todos');
      const todos = await res.json();
      allItems = todos
        .filter(t => t.completed && t.completed_at)
        .sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));
      render();
    }

    function render() {
      const container = document.getElementById('archive-list');
      const query     = document.getElementById('search-input').value.trim().toLowerCase();
      const filtered  = query ? allItems.filter(i => i.text.toLowerCase().includes(query)) : allItems;

      const count = document.getElementById('result-count');
      count.textContent = filtered.length === allItems.length
        ? `${allItems.length} item${allItems.length !== 1 ? 's' : ''}`
        : `${filtered.length} of ${allItems.length}`;

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:var(--text-3);font-size:13px;text-align:center;padding:24px 0;">No items found.</p>';
        return;
      }

      const groups = {};
      for (const item of filtered) {
        const key = new Date(item.completed_at).toLocaleDateString('en-US', {
          weekday: 'long', month: 'short', day: 'numeric', year: 'numeric',
        });
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      }

      container.innerHTML = Object.entries(groups).map(([day, entries]) => `
        <div style="margin-bottom:20px;">
          <p style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:8px;">${day}</p>
          ${entries.map(e => `
            <div class="archive-row">
              <span style="color:var(--text-3);font-size:12px;flex-shrink:0;">✓</span>
              <span class="flex-1" style="font-size:13px;color:var(--text);">${escHtml(e.text)}</span>
              <span style="font-size:11px;color:var(--text-3);flex-shrink:0;">${new Date(e.completed_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    window.onload = () => {
      document.querySelectorAll('.nm-nav a').forEach(a => { if (a.pathname === location.pathname) a.classList.add('active'); });
      loadArchive();
    };
  </script>
</head>
<body>
  <header class="nm-nav-wrap">
    <div class="nm-nav-inner">
      <a href="/" class="nm-brand">Life Receipt</a>
      <nav class="nm-nav">
        <a href="/">Home</a>
        <a href="/daily">Daily</a>
        <a href="/week-wrapped">Week Wrapped</a>
        <a href="/archive">Archive</a>
        <a href="/settings">Settings</a>
      </nav>
    </div>
  </header>

  <main style="max-width:560px;margin:0 auto;padding:8px 16px 48px;">

    <div class="flex items-center justify-between mb-5">
      <h1>Archive</h1>
      <span id="result-count" style="font-size:12px;color:var(--text-3);"></span>
    </div>

    <div class="nm-card">
      <input
        id="search-input"
        class="nm-input"
        type="search"
        placeholder="Search completed items…"
        oninput="render()"
        style="margin-bottom:20px;"
      />
      <div id="archive-list">
        <p style="color:var(--text-3);font-size:13px;text-align:center;padding:24px 0;">Loading…</p>
      </div>
    </div>

  </main>
</body>
</html>
